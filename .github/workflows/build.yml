name: Build site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[auto-build]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
      - run: TEST_BUILD=1 OUT_DIR=dist-test node build.js
      - name: Commit built site
        run: |
          git config user.name "auto-build"
          git config user.email "actions@github.com"
          git add -A dist dist-test
          git commit -m "[auto-build] Rebuild site" || echo "No changes"
          git push
